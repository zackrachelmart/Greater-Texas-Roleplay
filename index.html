<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LCRPQQ / WebERLC — More than a server. Your story. Your city." />
  <meta name="theme-color" content="#020d1d" />
  <title>LCRPQQ | WebERLC</title>
  <style>
    :root{--bg:#020d1d;--white:#f3f5f8;--blue:#85bdff;--muted:#cbd6e5;--line:rgba(255,255,255,.13)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 75% 55%,rgba(35,67,108,.28),transparent 38%),linear-gradient(180deg,#030b17,#061326);color:var(--white);font-family:Arial,Helvetica,sans-serif}
    .page{position:relative;min-height:100vh;overflow:hidden}.page:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 78% 55%,rgba(32,74,128,.15),transparent 28%),linear-gradient(90deg,rgba(2,8,17,.4),transparent 75%)}
    .topbar{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 48px}.top-left,.top-right{display:flex;align-items:center;gap:14px;font-weight:750;letter-spacing:.17em;text-transform:uppercase;font-size:clamp(.65rem,1.25vw,.9rem);color:#e8eef8}.dot{width:11px;height:11px;flex:0 0 11px;border-radius:50%;background:#a9cfff;box-shadow:0 0 16px rgba(140,193,255,.9)}.dot.white{background:#e8eef8;box-shadow:0 0 14px rgba(255,255,255,.8)}
    .content{position:relative;z-index:1;display:grid;grid-template-columns:1.28fr .72fr;align-items:center;gap:30px;width:min(1800px,calc(100% - 96px));min-height:calc(100vh - 60px);margin:0 auto}.left{padding:22px 0 52px;position:relative}h1{margin:0;font-size:clamp(4.5rem,10.4vw,11rem);line-height:.83;letter-spacing:-.085em;font-weight:950;text-transform:uppercase;color:var(--white)}h1 span{display:block;color:var(--blue)}.subtitle{margin-top:34px;max-width:900px;color:var(--muted);font-size:clamp(1.05rem,1.8vw,1.6rem);line-height:1.55}.buttons{display:flex;gap:24px;flex-wrap:wrap;margin-top:42px}.btn{display:inline-flex;align-items:center;justify-content:space-between;gap:28px;min-width:315px;min-height:78px;padding:0 28px;border:1px solid rgba(255,255,255,.2);border-radius:16px;background:linear-gradient(120deg,#86b9ff,#9474e9);color:#091426;font-weight:900;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;box-shadow:0 14px 35px rgba(86,129,220,.2);transition:transform .18s ease,filter .18s ease}.btn:hover{transform:translateY(-3px);filter:brightness(1.08)}.btn.secondary{background:rgba(255,255,255,.025);color:#edf3ff;border-color:rgba(255,255,255,.13);box-shadow:none}.arrow{font-size:1.6rem;line-height:1}
    .floating{position:absolute;width:8px;height:8px;background:#fff;border-radius:50%;box-shadow:0 0 15px #fff;opacity:.8}.f1{left:6%;top:10%}.f2{left:48%;top:23%}.f3{left:75%;top:15%}.f4{right:4%;top:40%}.f5{left:27%;bottom:4%}.f6{right:13%;bottom:15%}
    .right-side{position:relative;display:grid;place-items:center;min-height:600px}.badge-outer{position:relative;width:min(39vw,540px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(25,41,62,.76),rgba(8,16,28,.76) 70%);border:1px solid rgba(255,255,255,.14);box-shadow:0 0 70px rgba(89,142,214,.12),inset 0 0 45px rgba(255,255,255,.025)}.badge-outer:before{content:"";position:absolute;inset:14%;border:1px solid rgba(255,255,255,.13);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.2)}.badge-inner{width:72%;aspect-ratio:1;border-radius:50%;border:8px solid rgba(244,247,252,.93);display:grid;place-items:center;position:relative;background:rgba(9,18,31,.32);overflow:hidden}.shield{width:54%;height:62%;background:#f1f4f8;clip-path:polygon(50% 0,87% 13%,83% 58%,68% 83%,50% 100%,32% 83%,17% 58%,13% 13%);position:relative;filter:drop-shadow(0 6px 12px rgba(255,255,255,.14))}.shield:after{content:"";position:absolute;left:48%;top:-8%;width:9%;height:120%;background:#172437;transform:rotate(34deg);opacity:.85}.badge-name{position:absolute;right:11%;bottom:8%;color:#e5eaf2;font-size:clamp(.65rem,1.1vw,1rem);letter-spacing:.24em;font-weight:800}.halo{position:absolute;inset:-8%;border:1px solid rgba(255,255,255,.05);border-radius:50%;pointer-events:none}
    footer{position:relative;z-index:1;padding:0 48px 20px;color:#8594aa;font-size:.78rem;letter-spacing:.06em}
    @media(max-width:900px){.topbar{padding:16px 24px}.content{width:calc(100% - 48px);grid-template-columns:1fr;gap:0;min-height:auto;padding-top:35px}.right-side{grid-row:1;min-height:0;margin-bottom:32px}.badge-outer{width:min(42vw,250px)}.left{padding:0 0 60px}h1{font-size:clamp(4rem,14vw,7.3rem)}.subtitle{margin-top:24px}.buttons{margin-top:30px}.btn{min-width:0;min-height:66px;flex:1}footer{padding:0 24px 20px}}
    @media(max-width:560px){.topbar{padding:15px 16px}.top-left,.top-right{gap:8px;letter-spacing:.1em;font-size:.58rem}.dot{width:8px;height:8px;flex-basis:8px}.content{width:calc(100% - 32px);padding-top:22px}.right-side{margin-bottom:26px}.badge-outer{width:190px}.left{padding-bottom:40px}h1{font-size:clamp(3.4rem,16vw,5.4rem)}.subtitle{font-size:1rem}.buttons{flex-direction:column;gap:13px}.btn{width:100%;min-height:62px;padding:0 20px}.floating{width:6px;height:6px}footer{padding:0 16px 16px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
  </style>
</head>
<body>
  <main class="page">
    <div class="floating f1" aria-hidden="true"></div><div class="floating f2" aria-hidden="true"></div><div class="floating f3" aria-hidden="true"></div><div class="floating f4" aria-hidden="true"></div><div class="floating f5" aria-hidden="true"></div><div class="floating f6" aria-hidden="true"></div>
    <header class="topbar">
      <div class="top-left"><span class="dot"></span><span>More Than A Server</span></div>
      <div class="top-right"><span class="dot"></span><span>WebERLC</span></div>
    </header>
    <section class="content" aria-labelledby="hero-title">
      <div class="left">
        <h1 id="hero-title">Your Story.<span>Your City.</span></h1>
        <p class="subtitle">Meet the community, find your department, and make every session count.<br />Your next shift in LCRPQQ starts here.</p>
        <div class="buttons">
          <a class="btn" href="https://discord.gg/PSQThAyYPN" target="_blank" rel="noopener noreferrer">Join Discord <span class="arrow" aria-hidden="true">↗</span></a>
          <a class="btn secondary" href="https://discord.gg/PSQThAyYPN" target="_blank" rel="noopener noreferrer">Rejoin Server <span class="arrow" aria-hidden="true">↗</span></a>
        </div>
      </div>
      <div class="right-side" aria-label="LCRPQQ emblem">
        <div class="badge-outer"><div class="halo"></div><div class="badge-inner"><div class="shield"></div></div><div class="badge-name">LCRPQQ</div></div>
      </div>
    </section>
    <footer>© 2026 LCRPQQ / WebERLC</footer>
  </main>
</body>
</html>
