<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LCRPQQ / WebERLC — random joke generator powered by an external API." />
    <meta name="theme-color" content="#0a0f19" />
    <title>LCRPQQ | Random Joke Generator</title>
    <style>
      :root {
        --bg: #070d18;
        --bg-2: #0d1729;
        --panel: rgba(15, 21, 34, 0.86);
        --panel-strong: rgba(19, 27, 41, 0.92);
        --line: rgba(255, 255, 255, 0.08);
        --text: #edf3ff;
        --muted: #a8b6cc;
        --blue: #8ec6ff;
        --white: #f3f5fb;
        --shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        --button: linear-gradient(135deg, #84c6ff, #9d77ff);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at 70% 20%, rgba(75, 111, 160, 0.18), transparent 28%),
          linear-gradient(180deg, #070d18 0%, #0d1422 100%);
        color: var(--text);
      }

      a { text-decoration: none; color: inherit; }
      button { font: inherit; }

      .container {
        width: min(1200px, calc(100% - 32px));
        margin: 0 auto;
      }

      .hero {
        min-height: 100vh;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 30%, rgba(64, 101, 161, 0.18), transparent 35%),
          linear-gradient(90deg, rgba(5, 9, 18, 0.9), rgba(5, 9, 18, 0.65));
      }

      .content {
        position: relative;
        z-index: 1;
        width: min(960px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 26px;
        box-shadow: var(--shadow);
        padding: 38px 28px;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 16px;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--blue);
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.8rem, 5vw, 5rem);
        line-height: 0.94;
        letter-spacing: -0.07em;
      }

      .subtitle {
        margin-top: 18px;
        color: var(--muted);
        font-size: 1.04rem;
        line-height: 1.8;
        max-width: 680px;
      }

      .joke-box {
        margin-top: 28px;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px 20px;
        min-height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #jokeText {
        font-size: clamp(1.1rem, 1.8vw, 1.6rem);
        line-height: 1.7;
        color: var(--text);
        text-align: center;
        width: 100%;
      }

      .actions {
        margin-top: 26px;
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        border: 1px solid rgba(255,255,255,0.2);
        background: var(--button);
        color: #0a1220;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 16px 24px;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 16px 38px rgba(111, 157, 255, 0.2);
        transition: transform 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn.secondary {
        background: rgba(255,255,255,0.02);
        color: var(--white);
        border-color: rgba(255,255,255,0.12);
        box-shadow: none;
      }

      .status {
        margin-top: 18px;
        min-height: 22px;
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 680px) {
        .content {
          padding: 28px 18px;
        }

        .actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="container">
        <div class="content">
          <div class="eyebrow">LCRPQQ / WebERLC</div>
          <h1>Random Joke Generator</h1>
          <p class="subtitle">
            A quick laugh between calls. Press the button to fetch a fresh joke from an external joke API.
          </p>

          <div class="joke-box">
            <div id="jokeText">Loading joke...</div>
          </div>

          <div class="actions">
            <button class="btn" id="newJokeBtn">New Joke</button>
            <a class="btn secondary" href="https://discord.gg/PSQThAyYPN" target="_blank" rel="noreferrer">
              Join Discord
            </a>
          </div>

          <div id="status" class="status">Fetching from API...</div>
        </div>
      </div>
    </section>

    <script>
      const jokeText = document.getElementById('jokeText');
      const statusText = document.getElementById('status');
      const newJokeBtn = document.getElementById('newJokeBtn');

      async function fetchJoke() {
        statusText.textContent = 'Fetching from API...';
        jokeText.textContent = 'Loading joke...';

        try {
          const response = await fetch('https://v2.jokeapi.dev/joke/Any?type=single');

          if (!response.ok) {
            throw new Error('Request failed');
          }

          const data = await response.json();

          if (data.error) {
            throw new Error(data.message || 'API error');
          }

          jokeText.textContent = data.joke || `${data.setup} ${data.delivery}`;
          statusText.textContent = 'Fresh joke loaded';
        } catch (error) {
          jokeText.textContent = 'Oops! The joke API is unavailable right now. Try again in a moment.';
          statusText.textContent = 'API error';
        }
      }

      newJokeBtn.addEventListener('click', fetchJoke);
      fetchJoke();
    </script>
  </body>
</html>
